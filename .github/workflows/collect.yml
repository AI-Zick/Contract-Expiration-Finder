name: Collect live contract data

# Two jobs with different jobs to do:
#   test    runs on every push -- fast, no network dependency
#   collect runs on demand or on a schedule -- hits the real public APIs
# Splitting them keeps a code push from kicking off a twenty-minute crawl.
on:
  push:
    branches: ["**"]
    paths-ignore: ["docs/**", "README.md"]
  workflow_dispatch:
    inputs:
      sources:
        description: "Which sources to collect (blank = all)"
        default: "legistar usaspending"
      bootstrap:
        description: "Also discover and pin Socrata datasets (slow)"
        type: boolean
        default: false
      years_back:
        description: "Years of council agendas to scan"
        default: "6"
  schedule:
    # Weekly. Expiration dates do not move often enough to justify more.
    - cron: "17 6 * * 1"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: pytest -q

  collect:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .

      # Prove the runner reaches a real government API before spending
      # twenty minutes discovering that it cannot.
      - name: Live API reachability
        run: pdcontracts try --limit 10

      - name: Source health
        run: pdcontracts doctor --timeout 15 || true

      - run: pdcontracts init

      - name: Discover and pin real Socrata datasets
        if: github.event.inputs.bootstrap == 'true'
        run: timeout 900 pdcontracts bootstrap --write --limit 4 || true

      - name: Collect from live sources
        env:
          SOURCES: ${{ github.event.inputs.sources }}
        run: |
          if [ -n "$SOURCES" ]; then
            pdcontracts collect --only $SOURCES
          else
            pdcontracts collect
          fi

      - name: Coverage
        run: pdcontracts stats --log

      - name: Build published pipeline
        run: |
          mkdir -p docs
          pdcontracts report --format html -o docs/index.html --top 500
          pdcontracts report --format csv  -o docs/pipeline.csv --top 500
          python - <<'PY'
          import datetime as dt, json, pathlib
          from pdcontracts.store import Store
          from pdcontracts.config import load_settings
          from pdcontracts.pitch import build_targets
          from pdcontracts.report import group_opportunities
          from pdcontracts.web import build_payload

          settings = load_settings()
          store = Store(settings["database"])
          contracts = [c for c in store.contracts(categories=settings["focus_categories"])
                       if c.source != "cooperative"]
          opps = group_opportunities(
              build_targets(contracts, store.get_agencies(), dt.date.today()))
          payload = build_payload(opps, settings["focus_categories"], dt.date.today())
          pathlib.Path("docs/pipeline.json").write_text(json.dumps(payload, default=str))

          # Compact digest, small enough to read back through the API.
          digest = {
            "generated": dt.date.today().isoformat(),
            "totals": store.stats(),
            "runs": store.collection_log(40),
            "top": [{k: o[k] for k in ("agency","state","incumbent","categoryLabels",
                                       "annual","expires","budgetDeadline","stage",
                                       "priority","sources")}
                    for o in payload["opportunities"][:80]],
            "raw_sample": [
              {"agency": c.agency_name, "vendor": c.vendor_canonical,
               "cat": c.category, "start": str(c.start_date), "end": str(c.end_date),
               "value": c.total_value, "src": c.source, "url": c.source_url,
               "desc": c.description[:220]}
              for c in sorted(contracts, key=lambda c: c.total_value or 0, reverse=True)[:40]
            ],
          }
          pathlib.Path("docs/digest.json").write_text(json.dumps(digest, indent=1, default=str))
          print("=== TOTALS ==="); print(json.dumps(digest["totals"], indent=1))
          store.close()
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: pipeline
          path: |
            docs/
            pdcontracts.sqlite

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs config/sources.yml
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "Live collection $(date -u +%Y-%m-%d) [skip ci]"
            git pull --rebase --autostash || true
            git push
          fi
