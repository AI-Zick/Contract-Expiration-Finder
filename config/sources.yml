  - {name: oakland,       type: socrata, enabled: false, domain: data.oaklandca.gov,      dataset: "", state: CA, jurisdiction: Oakland}
  - {name: buffalo,       type: socrata, enabled: false, domain: data.buffalony.gov,      dataset: "", state: NY, jurisdiction: Buffalo}
  - {name: montgomery-md, type: socrata, enabled: false, domain: data.montgomerycountymd.gov, dataset: "", state: MD, jurisdiction: Montgomery County}

  # --- City council agendas (Legistar). Highest-yield source for RMS/CAD/MDT:
  # --- these buys clear the threshold for a public council vote, so they show
  # --- up here as a dated resolution naming vendor, term and dollar ceiling,
  # --- often months before any contract register. No API key. The `client`
  # --- value is the city's Legistar slug -- check <client>.legistar.com.
  # Verified live against webapi.legistar.com. Clients returning 500 or
  # requiring a token are left configured but disabled, with the reason, so
  # nobody rediscovers this the hard way.
  - {name: leg-seattle,   type: legistar, enabled: true,  client: seattle,   state: WA, jurisdiction: Seattle,     years_back: 8, max_pages: 2}
  - {name: leg-oakland,   type: legistar, enabled: true,  client: oakland,   state: CA, jurisdiction: Oakland,     years_back: 8, max_pages: 2}
  - {name: leg-sanjose,   type: legistar, enabled: true,  client: sanjose,   state: CA, jurisdiction: San Jose,    years_back: 8, max_pages: 2}
  - {name: leg-denver,    type: legistar, enabled: true,  client: denver,    state: CO, jurisdiction: Denver,      years_back: 8, max_pages: 2}
  - {name: leg-milwaukee, type: legistar, enabled: true,  client: milwaukee, state: WI, jurisdiction: Milwaukee,   years_back: 8, max_pages: 2}
  - {name: leg-baltimore, type: legistar, enabled: true,  client: baltimore, state: MD, jurisdiction: Baltimore,   years_back: 8, max_pages: 2}
  - {name: leg-longbeach, type: legistar, enabled: true,  client: longbeach, state: CA, jurisdiction: Long Beach,  years_back: 8, max_pages: 2}
  # 500 Server Error from the Legistar API (their side, not ours):
  - {name: leg-chicago,   type: legistar, enabled: false, client: chicago,   state: IL, jurisdiction: Chicago,     years_back: 8, max_pages: 2}
  - {name: leg-atlanta,   type: legistar, enabled: false, client: atlanta,   state: GA, jurisdiction: Atlanta,     years_back: 8, max_pages: 2}
  - {name: leg-portland,  type: legistar, enabled: false, client: portland,  state: OR, jurisdiction: Portland,    years_back: 8, max_pages: 2}
  # 403 "Token is required" -- these deployments gate the public API:
  - {name: leg-nyc,       type: legistar, enabled: false, client: nyc,       state: NY, jurisdiction: New York City, years_back: 8, max_pages: 2}
  - {name: leg-philly,    type: legistar, enabled: false, client: phila,     state: PA, jurisdiction: Philadelphia,  years_back: 8, max_pages: 2}

