# Data sources.
#
# HOW TO BOOTSTRAP THE SOCRATA ENTRIES
# ------------------------------------
# Socrata dataset IDs change and cities retire datasets, so none are hardcoded
# here. Fill them in at runtime:
#
#   pdcontracts discover --all          # search every domain below
#   pdcontracts discover data.cityofchicago.org
#
# Paste the dataset id into the matching entry, set enabled: true, then:
#
#   pdcontracts doctor                  # confirm it is reachable and mappable
#
# Column names are inferred automatically. If a portal is mapped wrong, pin it:
#   columns: {end_date: contract_expiration, vendor: supplier_name}

sources:

  # --- Federal awards. Works with no setup and no API key. ----------------
  # Direct federal law enforcement purchases, plus JAG/COPS grants to cities.
  # A grant naming "records management" is an early buying signal: the money
  # is appropriated but the vendor has not been chosen yet.
  - name: usaspending
    type: usaspending
    enabled: true
    include_grants: true
    # Grants are the national layer: JAG and COPS awards reach hundreds of
    # local agencies a year, and each one names a buyer that has money and has
    # not chosen a vendor.
    years_back: 10
    max_pages: 12
    keywords:
      - police records management system
      - law enforcement records management
      - computer aided dispatch
      - mobile data terminal
      - mobile data computer
      - police mobile field reporting
      - law enforcement software
      - public safety software
      - police department software
      - sheriff records management
      - CAD RMS
      - police technology upgrade

  # --- Cooperative purchasing vehicles ------------------------------------
  # Not agency contracts -- these are the master agreements an agency can buy
  # off to skip an RFP entirely. See config/cooperative_contracts.csv.
  - name: cooperative-vehicles
    type: cooperative
    enabled: true
    path: config/cooperative_contracts.csv

  # --- City portals. Run `discover --all` to fill in `dataset`. ------------
  - {name: chicago,       type: socrata, enabled: false, domain: data.cityofchicago.org,  dataset: "", state: IL, jurisdiction: Chicago}
  - {name: nyc,           type: socrata, enabled: false, domain: data.cityofnewyork.us,   dataset: "", state: NY, jurisdiction: New York City}
  - {name: los-angeles,   type: socrata, enabled: false, domain: controllerdata.lacity.org, dataset: "", state: CA, jurisdiction: Los Angeles}
  - {name: san-francisco, type: socrata, enabled: false, domain: data.sfgov.org,          dataset: "", state: CA, jurisdiction: San Francisco}
  - {name: austin,        type: socrata, enabled: false, domain: data.austintexas.gov,    dataset: "", state: TX, jurisdiction: Austin}
  - {name: baltimore,     type: socrata, enabled: false, domain: data.baltimorecity.gov,  dataset: "", state: MD, jurisdiction: Baltimore}
  - {name: seattle,       type: socrata, enabled: false, domain: data.seattle.gov,        dataset: "", state: WA, jurisdiction: Seattle}
  - {name: nashville,     type: socrata, enabled: false, domain: data.nashville.gov,      dataset: "", state: TN, jurisdiction: Nashville}
  - {name: kansas-city,   type: socrata, enabled: false, domain: data.kcmo.org,           dataset: "", state: MO, jurisdiction: Kansas City}
